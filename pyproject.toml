[project]
name = "systemlens"
version = "0.1.0"
description = "Indexe les contrats et signaux d'architecture interrogeables par agent"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "mcp>=1.0,<2",
    "networkx>=3.3,<4",
    "defusedxml>=0.7.1",
    "tree-sitter>=0.24,<0.25",
    "tree-sitter-java>=0.23",
]

[project.scripts]
systemlens = "systemlens.delivery.cli:app"
simpleweb = "systemlens.delivery.simpleweb:app"

[dependency-groups]
dev = [
    "archunitpython>=1.7.0",
    "bandit>=1.8.0",
    "coverage[toml]>=7.6.0",
    "hypothesis>=6.100.0",
    "mypy>=2.3.0",
    "playwright>=1.50",
    "pytest>=8.0",
    "ruff>=0.6",
    "semgrep>=1.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemlens"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "integration: tests d'intégration avec des dépendances externes",
    "slow: tests lents (téléchargement de modèle, etc.)",
]

[tool.mypy]
python_version = "3.13"
files = ["src/systemlens"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["systemlens"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = "systemlens.*"
disallow_untyped_defs = false
