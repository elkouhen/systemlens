name: Validate companion contracts

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/check_companion_contracts.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/companion-contracts.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/check_companion_contracts.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/companion-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: elkouhen/systemlens-skill
          path: .companions/systemlens-skill
      - uses: actions/checkout@v4
        with:
          repository: elkouhen/systemlens-observability-lab
          path: .companions/systemlens-observability-lab
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --group dev --frozen
      - run: >-
          uv run python scripts/check_companion_contracts.py
          --skill-root .companions/systemlens-skill
          --lab-root .companions/systemlens-observability-lab
